name: radar_territorial
description: "Radar Territorial - painel de inteligência territorial (Global Solution 2026.2 - FIAP)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # gerenciamento de estado
  provider: ^6.1.2
  # graficos dos dashboards
  fl_chart: ^1.0.0
  # chamadas para a API do Open-Meteo
  http: ^1.2.2
  # persistencia local (cache, limiares, ocorrencias, preferencias)
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
